server:
  port: ${TIPS_SERVICE_PORT}

spring:
  application:
    name: pet-tips
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS}
  ai:
    vectorstore:
      elasticsearch:
        initialize-schema: true
        index-name: pet-tips-knowledge
        similarity: cosine
        dimensions: 1024
    openai:
      api-key: ${DASHSCOPE_API_KEY}
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        options:
          model: qwen-max-latest
          temperature: 0.7
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      enabled: true
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR}
        enabled: true
      config:
        server-addr: ${NACOS_SERVER_ADDR}
        file-extension: yaml
        enabled: false
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/pet?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
  ai:
    openai:
      api-key: ${DASHSCOPE_API_KEY}
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        options:
          model: qwen-max-latest
          temperature: 0.7

tips-ai:
  embedding-model: text-embedding-v3
  vector-store:
    enabled: true
    search-top-k: 3
    similarity-threshold: 0.3

seata:
  enabled: false

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.pet.tips.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.pet.tips: debug

knife4j:
  enable: true
  openapi:
    title: 养宠贴士服务API
    description: 宠物领养平台养宠贴士服务接口文档
    version: 1.0.0
    group:
      default:
        group-name: default
        api-rule: package
        api-rule-resources:
          - com.pet.tips.controller

aliyun:
  oss:
    enabled: true
    endpoint: ${OSS_ENDPOINT}
    access-key-id: ${OSS_ACCESS_KEY_ID}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET}
    bucket-name: ${OSS_BUCKET_NAME}
